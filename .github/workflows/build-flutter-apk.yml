name: Build Flutter Android APK

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Primaya Ambulance Driver APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Doctor
        run: flutter doctor -v

      - name: Recreate Official Flutter Android Project
        working-directory: ./mobile
        run: |
          # Backup custom files
          mkdir -p /tmp/backup_res /tmp/backup_manifest
          cp -r android/app/src/main/res/* /tmp/backup_res/ || true
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml || true
          
          # Regenerate clean official Android configuration
          rm -rf android
          flutter create --platforms=android --org com.primayahospital .

          # Restore custom permissions and launcher styles
          cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/backup_res/* android/app/src/main/res/ || true

          # Configure AndroidX and memory in gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Install Dependencies
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: |
          set +e
          flutter build apk --release -v > build_output.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Flutter build failed with exit code $EXIT_CODE"
            echo "## ❌ Flutter Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build_output.txt
            exit $EXIT_CODE
          fi

      - name: Verify and Copy Native APK to Public Downloads
        run: |
          echo "Verifying generated release APK..."
          ls -lh mobile/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p public/downloads
          cp mobile/build/app/outputs/flutter-apk/app-release.apk public/downloads/primaya-ambulans.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: primaya-ambulance-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-verbose-log
          path: mobile/build_output.txt
          retention-days: 7
