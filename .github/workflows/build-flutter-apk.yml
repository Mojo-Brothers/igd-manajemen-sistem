name: Build Flutter Android APK

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Primaya Ambulance Driver APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Doctor
        run: flutter doctor -v

      - name: Recreate Official Flutter Android Project
        working-directory: ./mobile
        run: |
          # Regenerate clean official Android configuration
          rm -rf android
          flutter create --platforms=android --org com.primayahospital .

          # Inject GPS and Network permissions into the generated AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="primaya_ambulance"/android:label="Ambulans Primaya"/' android/app/src/main/AndroidManifest.xml

          # Configure AndroidX and memory in gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Configure explicit SDK versions in app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true

      - name: Install Dependencies & Patch Plugins
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get
          echo "Patching any legacy plugins referencing dynamic flutter extension properties..."
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} + || true


      - name: Build Android Release APK
        working-directory: ./mobile
        run: |
          set +e
          flutter build apk --release -v > build_output.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Flutter build failed with exit code $EXIT_CODE"
            tail -n 250 build_output.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B build-diagnostics
            git add build_output.txt
            git commit -m "chore: record build_output.txt for diagnostics"
            git push origin build-diagnostics --force || true
            exit $EXIT_CODE
          fi


      - name: Verify and Copy Native APK to Public Downloads
        run: |
          echo "Verifying generated release APK..."
          ls -lh mobile/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p public/downloads
          cp mobile/build/app/outputs/flutter-apk/app-release.apk public/downloads/primaya-ambulans.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: primaya-ambulance-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Push Native APK to apk-release Branch for Direct Download
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B apk-release
          git add -f public/downloads/primaya-ambulans.apk
          git commit -m "release: native Flutter release APK build"
          git push origin apk-release --force || true


      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-verbose-log
          path: mobile/build_output.txt
          retention-days: 7
