name: Build Flutter Android APK

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Primaya Ambulance Driver APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: |
          flutter clean
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: primaya-ambulance-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: mobile/build.log
          retention-days: 7

