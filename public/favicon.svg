<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Emergency Red Gradient Background -->
    <linearGradient id="igd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- White Medical Cross Gradient -->
    <linearGradient id="cross-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Cross Shadow -->
    <filter id="cross-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7F1D1D" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#igd-bg)" />

  <!-- 2. Subtle Inner Ring Highlight -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8" />

  <!-- 3. Medical Emergency Cross -->
  <g filter="url(#cross-shadow)">
    <!-- Horizontal Cross Bar -->
    <rect x="64" y="186" width="384" height="140" rx="30" fill="url(#cross-fill)" />
    <!-- Vertical Cross Bar -->
    <rect x="186" y="64" width="140" height="384" rx="30" fill="url(#cross-fill)" />
  </g>

  <!-- 4. Cardiac ECG Heartbeat Vital Wave in Emergency Red -->
  <path
    d="M 66 256 L 146 256 L 164 278 L 198 124 L 236 384 L 270 214 L 292 278 L 314 256 L 446 256"
    fill="none"
    stroke="#DC2626"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-contrast ECG Core Line -->
  <path
    d="M 66 256 L 146 256 L 164 278 L 198 124 L 236 384 L 270 214 L 292 278 L 314 256 L 446 256"
    fill="none"
    stroke="#EF4444"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Iconic "IGD" Emblem Badge -->
  <g filter="url(#card-shadow)">
    <!-- Badge Container with White Contrast Border -->
    <rect x="126" y="372" width="260" height="92" rx="26" fill="url(#badge-bg)" stroke="#FFFFFF" stroke-width="8" />
    <!-- Badge Text "IGD" -->
    <text
      x="256"
      y="437"
      font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="56"
      font-weight="900"
      letter-spacing="6"
      fill="#FFFFFF"
      text-anchor="middle"
    >
      IGD
    </text>
  </g>
</svg>
